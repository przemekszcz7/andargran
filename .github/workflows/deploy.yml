name: Automatyczne Wdrożenie do GitHub Pages

on:
  push:
    branches:
      - main
      - master # Triggers on both standard default branches

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Klonowanie repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalacja zależności
        run: npm install

      - name: Budowanie aplikacji (Vite Build)
        run: npm run build

      - name: Przygotowanie platformy GitHub Pages
        uses: actions/configure-pages@v4

      - name: Przesłanie skompilowanej zawartości (dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Wdrożenie na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
